<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zomboid Crop Calendar</title>
<meta name="description" content="Project Zomboid crop calendar for Build 42: best, neutral and poor planting months for all 55 crops. Search by name or month. English and Vietnamese.">

<meta property="og:title" content="Zomboid Crop Calendar">
<meta property="og:description" content="Best planting months for every Project Zomboid crop (Build 42). English / Tiếng Việt.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a field-notebook calendar. Month strip and month detail on top, full crop-by-month grid below with sticky header and crop column. */
  :root {
    color-scheme: light;
    --bg: #E4E8DF;
    --surface: #F2F4EE;
    --surface-2: #E9EDE4;
    --fg: #1A2119;
    --muted: #596457;
    --line: #C3CABD;
    --accent: #3C5A2B;
    --accent-fg: #F2F4EE;
    --best-bg: #2D7A3A;
    --best-fg: #FFFFFF;
    --mid-bg: #E2B820;
    --mid-fg: #231B03;
    --bad-bg: #B2352C;
    --bad-fg: #FFFFFF;
    --focus: #1C5FB8;
    --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12170F;
      --surface: #1A2117;
      --surface-2: #151B13;
      --fg: #E6EBDF;
      --muted: #9AA595;
      --line: #2E382B;
      --accent: #8DB874;
      --accent-fg: #0F150D;
      --best-bg: #4FB05E;
      --best-fg: #0A1A0D;
      --mid-bg: #D8AF24;
      --mid-fg: #1E1704;
      --bad-bg: #D45A50;
      --bad-fg: #1F0A08;
      --focus: #7FB2F0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12170F;
    --surface: #1A2117;
    --surface-2: #151B13;
    --fg: #E6EBDF;
    --muted: #9AA595;
    --line: #2E382B;
    --accent: #8DB874;
    --accent-fg: #0F150D;
    --best-bg: #4FB05E;
    --best-fg: #0A1A0D;
    --mid-bg: #D8AF24;
    --mid-fg: #1E1704;
    --bad-bg: #D45A50;
    --bad-fg: #1F0A08;
    --focus: #7FB2F0;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Header */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; flex: none; }
  .lang button { padding: 6px 12px; background: var(--surface); border: 0; cursor: pointer; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.06em; }
  .lang button + button { border-left: 1px solid var(--line); }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 8vw, 68px); line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
  .lede { margin: 0; max-width: 62ch; color: var(--muted); }

  /* Month strip */
  .months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
  .mbtn {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 4px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 4px; cursor: pointer; min-width: 0;
  }
  .mbtn .n { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; }
  .mbtn .e { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .mbtn:hover { border-color: var(--accent); }
  .mbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .mbtn[aria-pressed="true"] .e { color: var(--accent-fg); }
  @media (max-width: 720px) { .months { grid-template-columns: repeat(6, 1fr); } }

  /* Month detail */
  .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .detail-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  .detail-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 36px; line-height: 1; text-transform: uppercase; margin: 0; }
  .counts { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
  .groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  @media (max-width: 760px) { .groups { grid-template-columns: 1fr; gap: 16px; } }
  .group h3 { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 9px; border-radius: 3px; font-size: 13.5px; font-weight: 500; }
  .chip small { font-size: 11.5px; font-weight: 400; opacity: 0.85; }
  .chip.g { background: var(--best-bg); color: var(--best-fg); }
  .chip.y { background: var(--mid-bg); color: var(--mid-fg); }
  .chip.r { background: var(--bad-bg); color: var(--bad-fg); }
  .none { color: var(--muted); font-size: 13.5px; margin: 0; }
  .empty-month { color: var(--muted); margin: 0; }

  .sw { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 3px; font-size: 12px; font-weight: 600; line-height: 1; flex: none; }
  .sw.g { background: var(--best-bg); color: var(--best-fg); }
  .sw.y { background: var(--mid-bg); color: var(--mid-fg); }
  .sw.r { background: var(--bad-bg); color: var(--bad-fg); }

  /* Grid controls */
  .grid-head { display: flex; flex-direction: column; gap: 12px; }
  .grid-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .search { flex: 1 1 220px; max-width: 340px; min-width: 0; }
  .search input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
  .search input::placeholder { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .lbtn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; cursor: pointer; font-size: 13.5px; }
  .lbtn[aria-pressed="false"] { opacity: 0.5; text-decoration: line-through; text-decoration-thickness: 1px; }
  .lbtn:hover { border-color: var(--accent); }

  /* Grid */
  .tablebox { overflow: auto; max-height: min(74vh, 820px); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 720px; }
  thead th {
    position: sticky; top: 0; z-index: 3; background: var(--surface-2);
    border-bottom: 1px solid var(--line); padding: 0; font-weight: 500;
  }
  thead th.corner { left: 0; z-index: 4; text-align: left; padding: 10px 12px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .hbtn { width: 100%; display: block; padding: 8px 0; background: none; border: 0; cursor: pointer; text-align: center; }
  .hbtn .n { display: block; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1; }
  .hbtn .e { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  thead th.sel { background: var(--accent); }
  thead th.sel .hbtn, thead th.sel .e { color: var(--accent-fg); }
  tbody th {
    position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left;
    padding: 6px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
    min-width: 168px; font-weight: 600; font-size: 14px; line-height: 1.25;
  }
  tbody th small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
  tbody td { height: 44px; padding: 0; text-align: center; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); font-size: 14px; font-weight: 600; background: var(--surface-2); }
  tbody td:last-child { border-right: 0; }
  tbody td.g { background: var(--best-bg); color: var(--best-fg); }
  tbody td.y { background: var(--mid-bg); color: var(--mid-fg); }
  tbody td.r { background: var(--bad-bg); color: var(--bad-fg); }
  tbody td.sel { box-shadow: inset 3px 0 0 var(--fg), inset -3px 0 0 var(--fg); }
  tbody td.sel:not(.g):not(.y):not(.r) { background: var(--line); }
  tbody tr:hover th { background: var(--surface-2); }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
  .noresult { padding: 28px 16px; text-align: center; color: var(--muted); }


  @media (prefers-reduced-motion: no-preference) {
    .mbtn, .lbtn { transition: background-color 0.15s, border-color 0.15s; }
  }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title"></h1>
    <div class="lang" id="lang" role="group" aria-label="Language / Ngôn ngữ">
      <button type="button" data-l="en">EN</button>
      <button type="button" data-l="vi">VI</button>
    </div>
  </header>

  <div class="months" id="months" role="group"></div>

  <section class="detail" id="detail" aria-live="polite"></section>

  <section class="grid-head" aria-labelledby="grid-title">
    <h2 id="grid-title"></h2>
    <div class="controls">
      <div class="search"><input id="q" type="search" autocomplete="off"></div>
      <div class="legend" id="legend" role="group"></div>
    </div>
    <div class="tablebox" id="tablebox" tabindex="0"></div>
  </section>
</div>

<script>
(function () {
  // Pattern: 12 chars, Jan to Dec. g = best, y = neutral, r = poor, - = not plantable.
  var CROPS = [
    ["Barley", "Lúa mạch", "-------ygr--"],
    ["Basil", "Húng quế", "--gry-------"],
    ["Bell pepper", "Ớt chuông", "---ygr------"],
    ["Black sage", "Xô đen", "--yggyrr----"],
    ["Broadleaf plantain", "Mã đề lá rộng", "--ygyrry----"],
    ["Broccoli", "Bông cải xanh", "-ygyygr-----"],
    ["Cabbages", "Bắp cải", "-ygygyr-----"],
    ["Carrots", "Cà rốt", "-gyyygr-----"],
    ["Cauliflower", "Súp lơ trắng", "-ygr--------"],
    ["Chamomile", "Cúc La Mã", "--ygy-------"],
    ["Chives", "Hẹ", "--ygyrry----"],
    ["Cilantro", "Ngò rí", "--ygr-------"],
    ["Comfrey", "Tử thảo", "--ggyrry----"],
    ["Common mallow", "Cẩm quỳ", "--ggyrry----"],
    ["Corn", "Ngô", "--ygr-------"],
    ["Cucumber", "Dưa chuột", "--ygr-------"],
    ["Flax", "Lanh", "-------ygr--"],
    ["Garlic", "Tỏi", "------ygr---"],
    ["Green peas", "Đậu Hà Lan", "-ygr--------"],
    ["Habanero", "Ớt habanero", "---ygr------"],
    ["Hemp", "Gai dầu", "-------ygr--"],
    ["Hops", "Hoa bia", "-------ygr--"],
    ["Jalapeno", "Ớt jalapeño", "---ygr------"],
    ["Kale", "Cải xoăn", "-ygyyygr----"],
    ["Lavender", "Oải hương", "--ygr-------"],
    ["Leek", "Tỏi tây", "--yyyyyyy---"],
    ["Lemongrass", "Sả", "--yyyyyyy---"],
    ["Lettuce", "Xà lách", "-ygy--gyr---"],
    ["Marigold", "Cúc vạn thọ", "--ygr-------"],
    ["Mint", "Bạc hà", "-ygy--------"],
    ["Onions", "Hành tây", "-gr---------"],
    ["Oregano", "Kinh giới cay", "-ygr--------"],
    ["Parsley", "Mùi tây", "-ygr--------"],
    ["Poppies", "Hoa poppy", "--ygr-------"],
    ["Potatoes", "Khoai tây", "-ygr--------"],
    ["Pumpkin", "Bí ngô", "--ygr-------"],
    ["Radishes", "Củ cải đỏ", "-ygyyygr----"],
    ["Rosemary", "Hương thảo", "--yyyyyyy---"],
    ["Roses", "Hoa hồng", "--ygr-------"],
    ["Rye", "Lúa mạch đen", "-------ygr--"],
    ["Sage", "Xô thơm", "-ygr--------"],
    ["Soybeans", "Đậu nành", "--ygr-------"],
    ["Spinach", "Rau bina", "-ygyygr-----"],
    ["Strawberry plant", "Dâu tây", "-ygr--------"],
    ["Sugar beet", "Củ cải đường", "-ygyygr-----"],
    ["Sunflower", "Hướng dương", "--ygr-------"],
    ["Sweet potatoes", "Khoai lang", "----ygr-----"],
    ["Thyme", "Cỏ xạ hương", "-ygr--------"],
    ["Tobacco", "Thuốc lá", "--gyyyr-----"],
    ["Tomato vine", "Cà chua", "---ygr------"],
    ["Turnip", "Củ cải tròn", "----ygrygr--"],
    ["Watermelon", "Dưa hấu", "--ygr-------"],
    ["Wild garlic", "Tỏi dại", "------ygr---"],
    ["Winter wheat", "Lúa mì mùa đông", "-------ygr--"],
    ["Zucchini", "Bí ngòi", "--ygr-------"]
  ];
  var EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var EN_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var GLYPH = { g: "✓", y: "○", r: "✕" };
  var T = {
    vi: {
      title: "Zomboid Crop Calendar", gridTitle: "Bảng theo cây",
      months: "Chọn tháng", monthWord: "tháng", monthName: function (m) { return "Tháng " + m; },
      label: { g: "Tốt nhất", y: "Trung bình", r: "Kém" }, none: "Không có.",
      counts: function (g, y, r) { return g + " tốt · " + y + " trung bình · " + r + " kém"; },
      emptyMonth: "Không có cây nào cho tháng này.",
      search: "Tìm cây, ví dụ: potato, khoai", legend: "Hiện ô", crop: "Cây", noResult: "Không có cây nào khớp.",
      notPlant: "Ngoài mùa vụ", viewMonth: "Xem tháng ", tableAria: "Bảng lịch trồng theo tháng"
    },
    en: {
      title: "Zomboid Crop Calendar", gridTitle: "Crop chart",
      months: "Choose a month", monthWord: "", monthName: function (m) { return EN_FULL[m - 1]; },
      label: { g: "Best", y: "Neutral", r: "Poor" }, none: "None.",
      counts: function (g, y, r) { return g + " best · " + y + " neutral · " + r + " poor"; },
      emptyMonth: "No crops listed for this month.",
      search: "Search crops, e.g. potato", legend: "Show cells", crop: "Crop", noResult: "No matching crops.",
      notPlant: "Out of season", viewMonth: "View ", tableAria: "Planting calendar by month"
    }
  };

  var lang = "en";
  try { var saved = localStorage.getItem("zomboid-lang"); if (saved === "vi" || saved === "en") lang = saved; } catch (e) {}
  var sel = 3;
  var query = "";
  var visible = { g: true, y: true, r: true };

  var $title = document.getElementById("title");
  var $gridTitle = document.getElementById("grid-title");
  var $lang = document.getElementById("lang");
  var $months = document.getElementById("months");
  var $detail = document.getElementById("detail");
  var $legend = document.getElementById("legend");
  var $box = document.getElementById("tablebox");
  var $q = document.getElementById("q");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function stateAt(crop, m) {
    var c = crop[2].charAt(m - 1);
    return c === "-" ? "" : c;
  }
  function sub(c) { return lang === "vi" ? c[1] : ""; }
  function monthTag(m) { return lang === "vi" ? T.vi.monthWord : EN[m - 1]; }

  function renderStatic() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = "Zomboid Crop Calendar";
    $title.textContent = t.title;
    $gridTitle.textContent = t.gridTitle;
    $q.placeholder = t.search;
    $q.setAttribute("aria-label", t.search);
    $months.setAttribute("aria-label", t.months);
    $legend.setAttribute("aria-label", t.legend);
    $box.setAttribute("aria-label", t.tableAria);
    Array.prototype.forEach.call($lang.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.l === lang));
    });
  }

  function renderMonths() {
    var h = "";
    for (var m = 1; m <= 12; m++) {
      h += '<button type="button" class="mbtn" data-m="' + m + '" aria-pressed="' + (m === sel) + '" aria-label="' + esc(T[lang].monthName(m)) + '">' +
        '<span class="n">' + m + '</span><span class="e">' + esc(monthTag(m)) + '</span></button>';
    }
    $months.innerHTML = h;
  }

  function renderDetail() {
    var t = T[lang];
    var groups = { g: [], y: [], r: [] };
    CROPS.forEach(function (c) { var s = stateAt(c, sel); if (s) groups[s].push(c); });
    var total = groups.g.length + groups.y.length + groups.r.length;
    var h = '<div class="detail-head"><h2>' + esc(t.monthName(sel)) + '</h2><span class="counts">' +
      t.counts(groups.g.length, groups.y.length, groups.r.length) + '</span></div>';
    if (!total) {
      h += '<p class="empty-month">' + t.emptyMonth + '</p>';
    } else {
      h += '<div class="groups">';
      ["g", "y", "r"].forEach(function (k) {
        h += '<div class="group"><h3><span class="sw ' + k + '" aria-hidden="true">' + GLYPH[k] + '</span>' +
          t.label[k] + ' (' + groups[k].length + ')</h3>';
        if (!groups[k].length) {
          h += '<p class="none">' + t.none + '</p>';
        } else {
          h += '<ul class="chips">';
          groups[k].forEach(function (c) {
            h += '<li class="chip ' + k + '">' + esc(c[0]) + (sub(c) ? ' <small>' + esc(sub(c)) + '</small>' : '') + '</li>';
          });
          h += '</ul>';
        }
        h += '</div>';
      });
      h += '</div>';
    }
    $detail.innerHTML = h;
  }

  function renderLegend() {
    var h = "";
    ["g", "y", "r"].forEach(function (k) {
      h += '<button type="button" class="lbtn" data-k="' + k + '" aria-pressed="' + visible[k] + '">' +
        '<span class="sw ' + k + '" aria-hidden="true">' + GLYPH[k] + '</span>' + T[lang].label[k] + '</button>';
    });
    $legend.innerHTML = h;
  }

  function matches(c) {
    var q = query.trim().toLowerCase();
    if (!q) return true;
    return c[0].toLowerCase().indexOf(q) !== -1 || c[1].toLowerCase().indexOf(q) !== -1;
  }

  function renderTable() {
    var t = T[lang];
    var rows = CROPS.filter(function (c) {
      if (!matches(c)) return false;
      for (var m = 1; m <= 12; m++) { var s = stateAt(c, m); if (s && visible[s]) return true; }
      return false;
    });
    if (!rows.length) {
      $box.innerHTML = '<div class="noresult">' + t.noResult + '</div>';
      return;
    }
    var h = '<table><thead><tr><th class="corner" scope="col">' + t.crop + '</th>';
    for (var m = 1; m <= 12; m++) {
      h += '<th scope="col" data-m="' + m + '"' + (m === sel ? ' class="sel"' : '') + '>' +
        '<button type="button" class="hbtn" data-m="' + m + '" aria-label="' + esc(t.viewMonth + (lang === "vi" ? m : EN_FULL[m - 1])) + '">' +
        '<span class="n">' + m + '</span><span class="e">' + esc(monthTag(m)) + '</span></button></th>';
    }
    h += '</tr></thead><tbody>';
    rows.forEach(function (c) {
      h += '<tr><th scope="row">' + esc(c[0]) + (sub(c) ? '<small>' + esc(sub(c)) + '</small>' : '') + '</th>';
      for (var m = 1; m <= 12; m++) {
        var s = stateAt(c, m);
        var show = s && visible[s];
        var cls = (show ? s : "") + (m === sel ? " sel" : "");
        var label = s ? t.label[s] : t.notPlant;
        h += '<td data-m="' + m + '"' + (cls.trim() ? ' class="' + cls.trim() + '"' : '') +
          ' title="' + esc(c[0] + ", " + t.monthName(m) + ": " + label) + '">' + (show ? GLYPH[s] : "") + '</td>';
      }
      h += '</tr>';
    });
    h += '</tbody></table>';
    var sl = $box.scrollLeft, st = $box.scrollTop;
    $box.innerHTML = h;
    $box.scrollLeft = sl; $box.scrollTop = st;
  }

  function renderAll() { renderStatic(); renderMonths(); renderDetail(); renderLegend(); renderTable(); }
  function selectMonth(m) { sel = m; renderMonths(); renderDetail(); renderTable(); }

  $lang.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.dataset.l === lang) return;
    lang = b.dataset.l;
    try { localStorage.setItem("zomboid-lang", lang); } catch (err) {}
    renderAll();
  });
  $months.addEventListener("click", function (e) {
    var b = e.target.closest(".mbtn"); if (b) selectMonth(+b.dataset.m);
  });
  $box.addEventListener("click", function (e) {
    var b = e.target.closest(".hbtn"); if (b) selectMonth(+b.dataset.m);
  });
  $legend.addEventListener("click", function (e) {
    var b = e.target.closest(".lbtn"); if (!b) return;
    visible[b.dataset.k] = !visible[b.dataset.k];
    renderLegend(); renderTable();
  });
  $q.addEventListener("input", function () { query = $q.value; renderTable(); });

  renderAll();
})();
</script>
</body>
</html>
